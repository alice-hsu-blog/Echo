<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo
</title>
<style>
  :root {
    --bg: #faf6ef;
    --bg-alt: #f2ead9;
    --card-bg: #ffffff;
    --ink: #2b2620;
    --ink-soft: #6b6255;
    --accent: #8a5a3b;
    --accent-soft: #c9a98a;
    --border: #e4d9c4;
    --danger: #a34a3f;
    --shadow: 0 1px 3px rgba(60,45,20,0.08), 0 1px 2px rgba(60,45,20,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a16;
      --bg-alt: #262218;
      --card-bg: #262320;
      --ink: #ece5d6;
      --ink-soft: #a89e8c;
      --accent: #d3a377;
      --accent-soft: #8a6c4a;
      --border: #3a352a;
      --danger: #d97b6c;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a16; --bg-alt: #262218; --card-bg: #262320; --ink: #ece5d6;
    --ink-soft: #a89e8c; --accent: #d3a377; --accent-soft: #8a6c4a;
    --border: #3a352a; --danger: #d97b6c;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
  }
  :root[data-theme="light"] {
    --bg: #faf6ef; --bg-alt: #f2ead9; --card-bg: #ffffff; --ink: #2b2620;
    --ink-soft: #6b6255; --accent: #8a5a3b; --accent-soft: #c9a98a;
    --border: #e4d9c4; --danger: #a34a3f;
    --shadow: 0 1px 3px rgba(60,45,20,0.08), 0 1px 2px rgba(60,45,20,0.06);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    line-height: 1.6;
  }
  .quote-font { font-family: "Noto Serif TC", "PingFang TC", Georgia, serif; }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  header.top {
    text-align: center;
    margin-bottom: 28px;
  }
  header.top h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
    letter-spacing: 0.05em;
  }
  header.top p {
    color: var(--ink-soft);
    font-size: 0.85rem;
    margin: 0;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 14px 0 26px;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  .stats b { color: var(--accent); font-size: 1rem; }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 22px;
  }

  .panel h2 {
    font-size: 0.95rem;
    margin: 0 0 12px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  label {
    display: block;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  input[type="text"], textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 0.92rem;
    font-family: inherit;
    margin-bottom: 12px;
    resize: vertical;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent-soft);
  }

  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 180px; }

  button {
    font-family: inherit;
    font-size: 0.85rem;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.88; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-soft);
  }
  button.small {
    padding: 5px 11px;
    font-size: 0.78rem;
  }

  .search-box {
    position: sticky;
    top: 12px;
    z-index: 5;
    margin-bottom: 22px;
  }
  .search-box input {
    margin-bottom: 0;
    padding: 12px 16px;
    font-size: 1rem;
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .search-hint {
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-top: 6px;
    padding-left: 4px;
  }

  .quote-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 18px;
  }
  .quote-card .qtext {
    font-size: 1.15rem;
    line-height: 1.85;
    margin: 0 0 8px;
  }
  .quote-meta {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }
  .quote-source {
    color: var(--ink-soft);
    font-size: 0.83rem;
  }
  .scenarios {
    margin-top: 14px;
    border-top: 1px dashed var(--border);
    padding-top: 12px;
  }
  .scenario-group {
    background: var(--bg-alt);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .scenario-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .scenario-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
  }
  .practice-item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .practice-item .ptext {
    font-size: 0.94rem;
  }
  .practice-item .pmeta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
  }
  .practice-item .date {
    font-size: 0.7rem;
    color: var(--ink-soft);
  }
  mark {
    background: var(--accent-soft);
    color: var(--ink);
    border-radius: 3px;
    padding: 0 2px;
  }

  .add-scenario-form, .add-practice-form {
    margin-top: 10px;
  }
  .add-scenario-form.hidden, .add-practice-form.hidden { display: none; }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .global-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin: -8px 0 22px;
  }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    padding: 40px 20px;
    font-size: 0.9rem;
  }

  .toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 16px;
  }
  .toolbar input[type="file"] { display: none; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }

  .count-badge {
    font-size: 0.72rem;
    color: var(--ink-soft);
    background: var(--bg-alt);
    padding: 2px 8px;
    border-radius: 20px;
  }

  .quote-meta-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }

  .item-menu {
    position: relative;
  }
  .menu-btn, .collapse-toggle-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    width: 28px;
    height: 28px;
    padding: 0;
    font-size: 0.9rem;
    line-height: 1;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .collapse-toggle-btn .arrow-icon {
    width: 0.9rem;
    height: 0.9rem;
    display: block;
    transition: transform 0.15s ease;
  }
  .menu-dropdown {
    position: absolute;
    right: 0;
    top: calc(100% + 4px);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    min-width: 96px;
    z-index: 20;
    overflow: hidden;
  }
  .menu-dropdown.hidden { display: none; }
  .menu-dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--ink);
    border: none;
    border-radius: 0;
    padding: 8px 14px;
    font-size: 0.82rem;
  }
  .menu-dropdown button:hover { background: var(--bg-alt); opacity: 1; }
  .menu-dropdown button.danger-item { color: var(--danger); }

  .edit-form { margin-top: 10px; }
  .edit-actions {
    display: flex;
    gap: 8px;
    margin-top: 2px;
  }

  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 10, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .confirm-overlay.hidden { display: none; }
  .confirm-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 22px 24px;
    max-width: 360px;
    width: 100%;
  }
  .confirm-box p {
    margin: 0 0 18px;
    font-size: 0.92rem;
    line-height: 1.6;
    white-space: pre-line;
  }
  .confirm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1 class="quote-font">Echo: 寫作素材資料庫</h1>
    <p>累積名言佳句・記錄仿寫練習・依情境搜尋調用</p>
  </header>

  <div class="stats">
    <div><b id="statQuotes">0</b> 則名言</div>
    <div><b id="statPractices">0</b> 篇仿寫練習</div>
  </div>

  <div id="connStatus" style="text-align:center; font-size:0.75rem; color:var(--ink-soft); margin-bottom:18px;"></div>

  <div class="toolbar">
    <button class="secondary small" id="exportBtn">匯出備份 (JSON)</button>
    <button class="secondary small" id="importBtn">匯入備份</button>
    <input type="file" id="importFile" accept="application/json">
  </div>

  <div class="panel">
    <h2>新增名言佳句</h2>
    <label for="newQuoteText">名言原文</label>
    <textarea id="newQuoteText" rows="2" placeholder="輸入你想收藏的句子..."></textarea>
    <label for="newQuoteSource">出處</label>
    <input type="text" id="newQuoteSource" placeholder="例：《紅樓夢》第二十七回">
    <button id="addQuoteBtn">加入資料庫</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜尋情境、名言、出處或仿寫內容...">
    <div class="search-hint" id="searchHint"></div>
  </div>

  <div class="global-actions">
    <button class="secondary small" id="expandAllBtn">展開全部</button>
    <button class="secondary small" id="collapseAllBtn">折疊全部</button>
  </div>

  <div id="quoteList"></div>

</div>

<div class="toast" id="toast"></div>

<div class="confirm-overlay hidden" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMessage"></p>
    <div class="confirm-actions" id="confirmActions"></div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'writing-material-db-v1';
  const API_URL = '/api/data';

  /** @type {{quotes: Array}} */
  let db = { quotes: [] };
  let serverAvailable = false;

  // Tracks which single item (if any) is currently in inline-edit mode.
  // Shape: { type: 'quote'|'scenario'|'practice', qid, sid?, pid? }
  let editingState = null;
  function isEditing(type, ids) {
    if (!editingState || editingState.type !== type) return false;
    return Object.keys(ids).every(k => editingState[k] === ids[k]);
  }

  // Per-card display state, not persisted — resets on page reload.
  // { [qid]: bool } — true hides the scenarios+practices section, leaving just the quote.
  let cardCollapse = {};
  function getCollapse(qid) {
    return !!cardCollapse[qid];
  }

  function loadLocal() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { console.error('load failed', e); }
    return { quotes: [] };
  }

  function saveLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }

  function setConnStatus(connected) {
    serverAvailable = connected;
    const el = document.getElementById('connStatus');
    el.textContent = connected
      ? '● 已連接本機伺服器，資料會存到 writing_material_data.json'
      : '● 尚未連接到 Python 伺服器，目前只存在此瀏覽器（請執行 server.py 並改用 http://127.0.0.1:8899/ 開啟）';
    el.style.color = connected ? '#5a8a5f' : 'var(--danger)';
  }

  // Converts old flat quote.practices (each carrying its own scenario text)
  // into the current quote.scenarios[].practices[] grouping, and drops the
  // removed tags field. Safe to call on already-migrated data.
  function migrateDb(data) {
    if (!data || !Array.isArray(data.quotes)) return { quotes: [] };
    data.quotes.forEach(q => {
      if (!Array.isArray(q.scenarios)) {
        const groups = [];
        const byName = {};
        (q.practices || []).forEach(p => {
          const key = p.scenario || '未分類情境';
          if (!byName[key]) {
            byName[key] = { id: uid(), scenario: key, createdAt: p.createdAt || Date.now(), practices: [] };
            groups.push(byName[key]);
          }
          byName[key].practices.push({
            id: p.id || uid(),
            text: p.text,
            date: p.date || todayStr(),
            createdAt: p.createdAt || Date.now()
          });
        });
        q.scenarios = groups;
      }
      delete q.practices;
      delete q.tags;
    });
    return data;
  }

  async function init() {
    try {
      const res = await fetch(API_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('server responded with ' + res.status);
      db = migrateDb(await res.json());
      setConnStatus(true);
    } catch (e) {
      db = migrateDb(loadLocal());
      setConnStatus(false);
    }
    renderStats();
    render();
  }

  function save() {
    saveLocal(); // always keep a local backup
    renderStats();
    if (!serverAvailable) return;
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(db)
    }).then(res => {
      if (!res.ok) throw new Error('save failed');
      setConnStatus(true);
    }).catch(() => setConnStatus(false));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function todayStr() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function highlight(text, term) {
    const safe = esc(text);
    if (!term) return safe;
    const escTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try {
      return safe.replace(new RegExp(`(${escTerm})`, 'gi'), '<mark>$1</mark>');
    } catch (e) { return safe; }
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  // Custom in-page confirmation dialog. Replaces window.confirm(), which some
  // browsers permanently suppress after a user checks "prevent additional
  // dialogs" — confirm() then silently returns false forever, making delete
  // buttons look like they do nothing.
  function showChoice(message, buttons) {
    const overlay = document.getElementById('confirmOverlay');
    document.getElementById('confirmMessage').textContent = message;
    const actions = document.getElementById('confirmActions');
    actions.innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.textContent = b.label;
      btn.className = b.className || '';
      btn.onclick = () => {
        overlay.classList.add('hidden');
        if (b.action) b.action();
      };
      actions.appendChild(btn);
    });
    overlay.classList.remove('hidden');
  }

  function showConfirm(message, onConfirm) {
    showChoice(message, [
      { label: '取消', className: 'secondary' },
      { label: '確定', action: onConfirm }
    ]);
  }

  function closeAllMenus() {
    document.querySelectorAll('.menu-dropdown').forEach(d => d.classList.add('hidden'));
  }
  document.addEventListener('click', () => closeAllMenus());

  // ---------- rendering ----------

  function renderStats() {
    const totalPractices = db.quotes.reduce((sum, q) =>
      sum + q.scenarios.reduce((s2, sc) => s2 + sc.practices.length, 0), 0);
    document.getElementById('statQuotes').textContent = db.quotes.length;
    document.getElementById('statPractices').textContent = totalPractices;
  }

  function matchesQuote(q, term) {
    return q.text.toLowerCase().includes(term) || q.source.toLowerCase().includes(term);
  }

  function render() {
    const term = document.getElementById('searchInput').value.trim().toLowerCase();
    const list = document.getElementById('quoteList');
    const hint = document.getElementById('searchHint');
    list.innerHTML = '';

    const sortedQuotes = [...db.quotes].sort((a, b) => b.createdAt - a.createdAt);

    let visibleQuoteCount = 0;

    sortedQuotes.forEach(q => {
      const quoteSelfMatch = term ? matchesQuote(q, term) : false;
      const sortedScenarios = [...q.scenarios].sort((a, b) => b.createdAt - a.createdAt);

      let scenariosToShow = sortedScenarios.map(sc => {
        const sortedPractices = [...sc.practices].sort((a, b) => b.createdAt - a.createdAt);
        if (!term) return { ...sc, _practices: sortedPractices };
        const scenarioSelfMatch = sc.scenario.toLowerCase().includes(term);
        const practicesToShow = (quoteSelfMatch || scenarioSelfMatch)
          ? sortedPractices
          : sortedPractices.filter(p => p.text.toLowerCase().includes(term));
        if (!quoteSelfMatch && !scenarioSelfMatch && practicesToShow.length === 0) return null;
        return { ...sc, _practices: practicesToShow };
      }).filter(Boolean);

      if (term && !quoteSelfMatch && scenariosToShow.length === 0) return; // skip this quote

      visibleQuoteCount++;

      const totalPractices = q.scenarios.reduce((s, sc) => s + sc.practices.length, 0);
      const collapse = getCollapse(q.id);

      const card = document.createElement('div');
      card.className = 'quote-card';

      card.innerHTML = `
        <div class="quote-meta">
          ${isEditing('quote', { qid: q.id }) ? `
            <div class="edit-form" style="flex:1; margin-top:0;">
              <label>名言原文</label>
              <textarea rows="2" class="edit-quote-text">${esc(q.text)}</textarea>
              <label>出處</label>
              <input type="text" class="edit-quote-source" value="${esc(q.source)}">
              <div class="edit-actions">
                <button class="small save-edit-btn" data-type="quote" data-qid="${q.id}">儲存</button>
                <button class="small secondary cancel-edit-btn">取消</button>
              </div>
            </div>
          ` : `
            <div>
              <p class="qtext quote-font">「${highlight(q.text, term)}」</p>
              <div class="quote-source">${highlight(q.source || '出處未填', term)}</div>
            </div>
            <div class="quote-meta-right">
              <span class="count-badge">${totalPractices} 篇仿寫</span>
              <div class="item-menu">
                <button class="menu-btn" data-type="quote" data-qid="${q.id}">⚙</button>
                <div class="menu-dropdown hidden">
                  <button class="menu-edit-btn" data-type="quote" data-qid="${q.id}">編輯</button>
                  <button class="menu-delete-btn danger-item" data-type="quote" data-qid="${q.id}">刪除</button>
                </div>
              </div>
              <button class="secondary collapse-toggle-btn toggle-scenarios-visibility-btn" data-qid="${q.id}">
                <svg class="arrow-icon" style="transform: rotate(${collapse ? '-90deg' : '0deg'});" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          `}
        </div>

        ${collapse ? '' : `
        <div class="scenarios">
          ${scenariosToShow.length === 0
            ? `<div style="font-size:0.8rem;color:var(--ink-soft);">尚無情境，點下方「＋ 新增情境」開始吧</div>`
            : scenariosToShow.map(sc => `
              <div class="scenario-group" data-qid="${q.id}" data-sid="${sc.id}">
                ${isEditing('scenario', { qid: q.id, sid: sc.id }) ? `
                  <div class="edit-form" style="margin-top:0;">
                    <input type="text" class="edit-scenario-text" value="${esc(sc.scenario)}">
                    <div class="edit-actions">
                      <button class="small save-edit-btn" data-type="scenario" data-qid="${q.id}" data-sid="${sc.id}">儲存</button>
                      <button class="small secondary cancel-edit-btn">取消</button>
                    </div>
                  </div>
                ` : `
                  <div class="scenario-header">
                    <span class="scenario-title">情境：${highlight(sc.scenario, term)}</span>
                    <div class="item-menu">
                      <button class="menu-btn" data-type="scenario" data-qid="${q.id}" data-sid="${sc.id}">⚙</button>
                      <div class="menu-dropdown hidden">
                        <button class="menu-edit-btn" data-type="scenario" data-qid="${q.id}" data-sid="${sc.id}">編輯</button>
                        <button class="menu-delete-btn danger-item" data-type="scenario" data-qid="${q.id}" data-sid="${sc.id}">刪除</button>
                      </div>
                    </div>
                  </div>
                `}
                ${sc._practices.length === 0
                  ? `<div style="font-size:0.8rem;color:var(--ink-soft);">此情境尚無仿寫</div>`
                  : sc._practices.map(p => `
                    <div class="practice-item" data-pid="${p.id}">
                      ${isEditing('practice', { qid: q.id, sid: sc.id, pid: p.id }) ? `
                        <div class="edit-form" style="margin-top:0;">
                          <textarea rows="2" class="edit-practice-text">${esc(p.text)}</textarea>
                          <div class="edit-actions">
                            <button class="small save-edit-btn" data-type="practice" data-qid="${q.id}" data-sid="${sc.id}" data-pid="${p.id}">儲存</button>
                            <button class="small secondary cancel-edit-btn">取消</button>
                          </div>
                        </div>
                      ` : `
                        <div class="ptext">${highlight(p.text, term)}</div>
                        <div class="pmeta">
                          <span class="date">${esc(p.date)}</span>
                          <div class="item-menu">
                            <button class="menu-btn" data-type="practice" data-qid="${q.id}" data-sid="${sc.id}" data-pid="${p.id}">⚙</button>
                            <div class="menu-dropdown hidden">
                              <button class="menu-edit-btn" data-type="practice" data-qid="${q.id}" data-sid="${sc.id}" data-pid="${p.id}">編輯</button>
                              <button class="menu-delete-btn danger-item" data-type="practice" data-qid="${q.id}" data-sid="${sc.id}" data-pid="${p.id}">刪除</button>
                            </div>
                          </div>
                        </div>
                      `}
                    </div>
                  `).join('')
                }
                <div class="add-practice-form hidden" data-qid="${q.id}" data-sid="${sc.id}">
                  <textarea rows="2" class="practice-input" placeholder="寫下你的仿寫句子..."></textarea>
                  <button class="small submit-practice-btn" data-qid="${q.id}" data-sid="${sc.id}">加入仿寫</button>
                  <button class="small secondary cancel-practice-btn" data-qid="${q.id}" data-sid="${sc.id}">取消</button>
                </div>
                <button class="small secondary toggle-practice-btn" data-qid="${q.id}" data-sid="${sc.id}">＋</button>
              </div>
            `).join('')
          }
        </div>

        <div class="add-scenario-form hidden" data-qid="${q.id}">
          <label>情境</label>
          <input type="text" class="scenario-input" placeholder="例：描寫等待一個人卻等不到的焦慮">
          <button class="small submit-scenario-btn" data-qid="${q.id}">加入情境</button>
          <button class="small secondary cancel-scenario-btn" data-qid="${q.id}">取消</button>
        </div>

        <div class="card-actions">
          <button class="small toggle-scenario-btn" data-qid="${q.id}">＋ 新增情境</button>
        </div>
        `}
      `;
      list.appendChild(card);
    });

    if (sortedQuotes.length === 0) {
      list.innerHTML = `<div class="empty-state">還沒有收藏任何名言佳句，從上面「新增名言佳句」開始吧。</div>`;
    } else if (term && visibleQuoteCount === 0) {
      list.innerHTML = `<div class="empty-state">找不到符合「${esc(term)}」的名言、情境或仿寫練習。</div>`;
    }

    hint.textContent = term ? `找到 ${visibleQuoteCount} 則相關名言` : '';

    attachCardListeners();
  }

  function attachCardListeners() {
    // ---- scenario-level (add scenario to a quote) ----
    document.querySelectorAll('.toggle-scenario-btn').forEach(btn => {
      btn.onclick = () => {
        const qid = btn.dataset.qid;
        const form = document.querySelector(`.add-scenario-form[data-qid="${qid}"]`);
        form.classList.toggle('hidden');
        if (!form.classList.contains('hidden')) form.querySelector('.scenario-input').focus();
      };
    });

    document.querySelectorAll('.cancel-scenario-btn').forEach(btn => {
      btn.onclick = () => {
        const qid = btn.dataset.qid;
        const form = document.querySelector(`.add-scenario-form[data-qid="${qid}"]`);
        form.classList.add('hidden');
        form.querySelector('.scenario-input').value = '';
      };
    });

    document.querySelectorAll('.submit-scenario-btn').forEach(btn => {
      btn.onclick = () => {
        const qid = btn.dataset.qid;
        const form = document.querySelector(`.add-scenario-form[data-qid="${qid}"]`);
        const scenario = form.querySelector('.scenario-input').value.trim();
        if (!scenario) {
          toast('請填寫情境');
          return;
        }
        const quote = db.quotes.find(q => q.id === qid);
        quote.scenarios.push({ id: uid(), scenario, createdAt: Date.now(), practices: [] });
        save();
        render();
        toast('已加入情境');
      };
    });

    // ---- practice-level (add practice within a scenario) ----
    document.querySelectorAll('.toggle-practice-btn').forEach(btn => {
      btn.onclick = () => {
        const { qid, sid } = btn.dataset;
        const form = document.querySelector(`.add-practice-form[data-qid="${qid}"][data-sid="${sid}"]`);
        form.classList.toggle('hidden');
        if (!form.classList.contains('hidden')) form.querySelector('.practice-input').focus();
      };
    });

    document.querySelectorAll('.cancel-practice-btn').forEach(btn => {
      btn.onclick = () => {
        const { qid, sid } = btn.dataset;
        const form = document.querySelector(`.add-practice-form[data-qid="${qid}"][data-sid="${sid}"]`);
        form.classList.add('hidden');
        form.querySelector('.practice-input').value = '';
      };
    });

    document.querySelectorAll('.submit-practice-btn').forEach(btn => {
      btn.onclick = () => {
        const { qid, sid } = btn.dataset;
        const form = document.querySelector(`.add-practice-form[data-qid="${qid}"][data-sid="${sid}"]`);
        const text = form.querySelector('.practice-input').value.trim();
        if (!text) {
          toast('請填寫仿寫內容');
          return;
        }
        const quote = db.quotes.find(q => q.id === qid);
        const scenario = quote.scenarios.find(sc => sc.id === sid);
        scenario.practices.push({ id: uid(), text, date: todayStr(), createdAt: Date.now() });
        save();
        render();
        toast('已加入仿寫練習');
      };
    });

    // ---- per-card collapse control ----
    document.querySelectorAll('.toggle-scenarios-visibility-btn').forEach(btn => {
      btn.onclick = () => {
        const qid = btn.dataset.qid;
        cardCollapse[qid] = !getCollapse(qid);
        render();
      };
    });

    // ---- item menu (gear dropdown shared by quote / scenario / practice) ----
    document.querySelectorAll('.menu-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const dropdown = btn.nextElementSibling;
        const wasHidden = dropdown.classList.contains('hidden');
        closeAllMenus();
        if (wasHidden) dropdown.classList.remove('hidden');
      };
    });

    document.querySelectorAll('.menu-edit-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        closeAllMenus();
        const { type, qid, sid, pid } = btn.dataset;
        editingState = { type, qid, sid, pid };
        render();
      };
    });

    document.querySelectorAll('.menu-delete-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        closeAllMenus();
        const { type, qid, sid, pid } = btn.dataset;

        if (type === 'quote') {
          const quote = db.quotes.find(q => q.id === qid);
          const practiceCount = quote.scenarios.reduce((s, sc) => s + sc.practices.length, 0);
          const msg = practiceCount > 0
            ? `這則名言底下有 ${quote.scenarios.length} 個情境、共 ${practiceCount} 篇仿寫練習，確定要一併刪除嗎？`
            : '確定要刪除這則名言嗎？';
          showConfirm(msg, () => {
            db.quotes = db.quotes.filter(q => q.id !== qid);
            save();
            render();
          });
        } else if (type === 'scenario') {
          const quote = db.quotes.find(q => q.id === qid);
          const scenario = quote.scenarios.find(sc => sc.id === sid);
          const msg = scenario.practices.length > 0
            ? `這個情境底下有 ${scenario.practices.length} 篇仿寫，確定要一併刪除嗎？`
            : '確定要刪除這個情境嗎？';
          showConfirm(msg, () => {
            quote.scenarios = quote.scenarios.filter(sc => sc.id !== sid);
            save();
            render();
          });
        } else if (type === 'practice') {
          showConfirm('確定要刪除這篇仿寫練習嗎？', () => {
            const quote = db.quotes.find(q => q.id === qid);
            const scenario = quote.scenarios.find(sc => sc.id === sid);
            scenario.practices = scenario.practices.filter(p => p.id !== pid);
            save();
            render();
          });
        }
      };
    });

    // ---- inline edit save/cancel (shared by quote / scenario / practice) ----
    document.querySelectorAll('.save-edit-btn').forEach(btn => {
      btn.onclick = () => {
        const { type, qid, sid, pid } = btn.dataset;
        const container = btn.closest('.edit-form');

        if (type === 'quote') {
          const text = container.querySelector('.edit-quote-text').value.trim();
          const source = container.querySelector('.edit-quote-source').value.trim();
          if (!text) { toast('請輸入名言原文'); return; }
          const quote = db.quotes.find(q => q.id === qid);
          quote.text = text;
          quote.source = source;
        } else if (type === 'scenario') {
          const scenarioText = container.querySelector('.edit-scenario-text').value.trim();
          if (!scenarioText) { toast('請輸入情境'); return; }
          const quote = db.quotes.find(q => q.id === qid);
          const scenario = quote.scenarios.find(sc => sc.id === sid);
          scenario.scenario = scenarioText;
        } else if (type === 'practice') {
          const text = container.querySelector('.edit-practice-text').value.trim();
          if (!text) { toast('請輸入仿寫內容'); return; }
          const quote = db.quotes.find(q => q.id === qid);
          const scenario = quote.scenarios.find(sc => sc.id === sid);
          const practice = scenario.practices.find(p => p.id === pid);
          practice.text = text;
        }

        editingState = null;
        save();
        render();
        toast('已儲存修改');
      };
    });

    document.querySelectorAll('.cancel-edit-btn').forEach(btn => {
      btn.onclick = () => {
        editingState = null;
        render();
      };
    });
  }

  // ---------- add quote ----------
  document.getElementById('addQuoteBtn').onclick = () => {
    const text = document.getElementById('newQuoteText').value.trim();
    const source = document.getElementById('newQuoteSource').value.trim();
    if (!text) {
      toast('請輸入名言原文');
      return;
    }
    db.quotes.push({
      id: uid(),
      text,
      source,
      createdAt: Date.now(),
      scenarios: []
    });
    save();
    document.getElementById('newQuoteText').value = '';
    document.getElementById('newQuoteSource').value = '';
    render();
    toast('已加入資料庫');
  };

  // ---------- search ----------
  document.getElementById('searchInput').addEventListener('input', render);

  // ---------- global expand/collapse all ----------
  document.getElementById('expandAllBtn').onclick = () => {
    db.quotes.forEach(q => { cardCollapse[q.id] = false; });
    render();
  };

  document.getElementById('collapseAllBtn').onclick = () => {
    db.quotes.forEach(q => { cardCollapse[q.id] = true; });
    render();
  };

  // ---------- export / import ----------
  document.getElementById('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const pad = n => String(n).padStart(2, '0');
    const d = new Date();
    a.href = url;
    a.download = `寫作素材庫備份_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('已匯出備份');
  };

  document.getElementById('importBtn').onclick = () => {
    document.getElementById('importFile').click();
  };

  document.getElementById('importFile').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const raw = JSON.parse(reader.result);
        if (!raw || !Array.isArray(raw.quotes)) {
          throw new Error('格式不正確');
        }
        const imported = migrateDb(raw);
        showChoice('要如何處理匯入的備份？\n「取代」會清空目前資料庫，換成備份內容。\n「合併」會保留現有資料，加入備份中沒有的內容。', [
          { label: '取消', className: 'secondary' },
          { label: '合併', className: 'secondary', action: () => {
            const existingIds = new Set(db.quotes.map(q => q.id));
            imported.quotes.forEach(q => {
              if (!existingIds.has(q.id)) db.quotes.push(q);
            });
            save();
            render();
            toast('匯入完成（已合併）');
          } },
          { label: '取代', action: () => {
            db = imported;
            save();
            render();
            toast('匯入完成（已取代）');
          } }
        ]);
      } catch (err) {
        toast('匯入失敗：檔案格式不正確');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  };

  // ---------- init ----------
  init();
})();
</script>
</body>
</html>
