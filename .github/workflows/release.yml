name: Release Echo

# Builds installers for Windows, Linux, and macOS (both Intel and Apple
# Silicon, as one universal binary) in parallel on GitHub's own runners —
# Tauri needs to compile natively on each target OS, which this machine
# can't do on its own. Creates a draft GitHub Release with all installers
# attached; nothing goes public until someone reviews and publishes it by
# hand from the repo's Releases page.
#
# Trigger manually: GitHub repo -> Actions tab -> "Release Echo" -> Run workflow.
# Or push a tag matching app-v* (e.g. `git tag app-v0.1.0 && git push origin app-v0.1.0`).
on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Echo v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
